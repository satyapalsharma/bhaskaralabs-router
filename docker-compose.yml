services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bhaskara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.deploy}
      POSTGRES_DB: bhaskara
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    env_file:
      - .env.deploy
    environment:
      PORT: "8793"
      DATABASE_URL: postgres://bhaskara:${POSTGRES_PASSWORD:?set in .env.deploy}@postgres:5432/bhaskara
    depends_on:
      - postgres
    restart: unless-stopped
    # No published ports — Caddy is the only ingress.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Build-time only. If `next build` prerenders DB-backed pages, rebuild
        # with the real DATABASE_URL (same box, safe).
        DATABASE_URL: ${DATABASE_URL_BUILD:-postgres://build:build@localhost:5432/build}
    env_file:
      - .env.deploy
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://bhaskara:${POSTGRES_PASSWORD:?set in .env.deploy}@postgres:5432/bhaskara
    depends_on:
      - postgres
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
      - web
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
